const paths={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',layers:'<path d="m12 3 10 5-10 5L2 8zM2 12l10 5 10-5M2 16l10 5 10-5"/>',checklist:'<rect x="5" y="4" width="14" height="18" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="m8 13 3 3 5-6"/>',settings:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',medical:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 5V3h8v2M12 9v8M8 13h8"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',chevron:'<path d="m9 5 7 7-7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v4h16v-4"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 16v4h16v-4"/>',refresh:'<path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="m12 3 10 18H2zM12 9v4M12 17h.01"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',book:'<path d="M12 5v16M12 5C8 2 4 3 2 4v15c4-2 7-1 10 2 3-3 6-4 10-2V4c-3-1-6-2-10 1Z"/>',collapse:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18m7-14-3 5 3 5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>',cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>',database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',play:'<path d="m7 4 14 8-14 8z"/>',left:'<path d="M19 12H5m5-5-5 5 5 5"/>',flask:'<path d="M9 3h6m-5 0v7l-6 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-9V3M7 16h10"/>',shield:'<path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6z"/><path d="m8 12 3 3 5-6"/>',sort:'<path d="M8 4v16m-4-4 4 4 4-4M16 20V4m-4 4 4-4 4 4"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',activity:'<path d="M2 12h5l3-9 4 18 3-9h5"/>'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.file}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,action='',cls='',ico='')=>`<button type="button" class="btn ${cls}" ${action?`data-action="${action}"`:''}>${ico?icon(ico):''}${text}</button>`;
const badge=(text,tone='',ico='')=>`<span class="badge ${tone}">${ico?icon(ico):''}${text}</span>`;
const tasks=[{id:'QC-1016-006',name:'胸部 CT 验证集',file:'chest_ct_validation.xlsx',n:10,status:'completed',done:40,total:40,time:'10-16 09:58',pending:8},{id:'QC-1016-005',name:'影像报告测试集',file:'report_validation_10.csv',n:10,status:'partial',done:40,total:40,time:'10-16 09:35',pending:6},{id:'QC-1016-004',name:'单份报告质控',file:'手动录入 · 胸部 CT',n:1,status:'running',done:2,total:4,time:'10-16 09:29',pending:0},{id:'QC-1016-003',name:'单份报告质控',file:'手动录入 · 胸部 CT',n:1,status:'partial',done:4,total:4,time:'10-16 09:18',pending:2},{id:'QC-1015-002',name:'医学报告实验样本',file:'medical_samples.xlsx',n:6,status:'completed',done:24,total:24,time:'10-15 17:56',pending:4},{id:'QC-1015-001',name:'单份报告质控',file:'手动录入 · 胸部 CT',n:1,status:'completed',done:4,total:4,time:'10-15 17:54',pending:1}];
const state={page:'overview',task:0,branch:'csc',reviewTask:false,queue:0,queuePage:0,collapsed:false,filter:'all',query:'',sort:false,decision:{},importStep:1,filename:'',selected:['diagnosis','csc','cgec','rag'],description:'双肺纹理增多，右肺上叶见条索状高密度影，边界尚清。\n双侧肺门未见明显增大。气管及主支气官通畅。\n纵隔内未见明显肿大淋巴结，心影大小正常。\n双侧胸腔未见积液。',diagnosis:'1. 右肺下叶纤维灶。\n2. 双肺纹理增多。'};
const checks=[['diagnosis','诊断一致性','描述与诊断交叉核验','shield'],['csc','字符纠错','错别字与形近字检查','file'],['cgec','语法纠错','语序、成分及表达检查','book'],['rag','检索增强定位','参考报告溯源与定位','search']];
const names={overview:'工作台',single:'单份质控',batch:'批量任务',task:'任务详情',report:'报告详情',review:'人工复核',settings:'运行配置',components:'组件与风格'};
function decisionKey(q=state.queue,b=state.branch){return `${state.task}:${q}:${b}`}
function pendingTotal(){return 21-Object.values(state.decision).filter(v=>v!=='暂缓').length}
function pendingFor(t){return Math.max(0,t.pending-Object.entries(state.decision).filter(([k,v])=>k.startsWith(tasks.indexOf(t)+':')&&v!=='暂缓').length)}
function status(s){return {completed:badge('已完成','green','check'),partial:badge('部分完成','amber','alert'),running:badge('运行中','blue','clock'),pending:badge('待启动','','clock')}[s]||badge(s)}
function toast(message){clearTimeout(window.toastTimer);document.querySelector('#toast-root').innerHTML=`<div class="toast">${icon('check')}${esc(message)}</div>`;window.toastTimer=setTimeout(()=>document.querySelector('#toast-root').innerHTML='',3200)}
function goto(page){state.page=page;state.filter='all';state.query='';location.hash=page;render()}
function headerActions(){switch(state.page){case'overview':return btn('导入报告','import','','upload')+btn('新建质控','goto:single','primary','plus');case'single':return btn('填入示例','sample','','file')+btn('开始质控','start','primary','play');case'batch':return btn('刷新','refresh','','refresh')+btn('导入报告','import','primary','upload');case'task':return btn('返回任务','goto:batch','ghost','left')+btn('导出结果','export','','download')+(tasks[state.task].status==='partial'?btn('重试失败项','retry','primary','refresh'):'');case'report':return btn('返回任务','goto:task','ghost','left')+btn('检索报告 · Top 10','evidence','','book');case'review':return (state.reviewTask?btn('返回任务列表','review-back','ghost','left'):'')+btn('刷新队列','refresh','','refresh');case'settings':return btn('重新检测','detect','','refresh');case'components':return btn('查看选型依据','sources','','book');default:return''}}
function render(){const navActive=['task','report'].includes(state.page)?'batch':state.page;document.body.classList.toggle('collapsed',state.collapsed);document.querySelector('#app').innerHTML=`<aside class="sidebar"><a class="brand" href="#overview" data-action="goto:overview"><span class="brand-mark">${icon('medical')}</span><span class="brand-copy"><strong>CDU-MED <span style="font-weight:400">Studio</span></strong><small>医学影像报告质控</small></span></a><div class="nav-label">工作空间</div><nav class="nav" aria-label="主导航">${[['overview','grid'],['single','file'],['batch','layers'],['review','checklist']].map(([k,i])=>`<a href="#${k}" data-action="goto:${k}" class="${navActive===k?'active':''}" ${navActive===k?'aria-current="page"':''} title="${names[k]}">${icon(i)}<span class="nav-name">${names[k]}</span>${k==='batch'?'<span class="nav-count">6</span>':k==='review'?`<span class="nav-count">${pendingTotal()}</span>`:''}</a>`).join('')}</nav><div class="side-bottom"><nav class="nav" aria-label="系统导航">${[['settings','settings'],['components','grid']].map(([k,i])=>`<a href="#${k}" data-action="goto:${k}" class="${state.page===k?'active':''}" title="${names[k]}">${icon(i)}<span class="nav-name">${names[k]}</span></a>`).join('')}</nav><button class="side-button" data-action="collapse" title="${state.collapsed?'展开':'收起'}侧栏" aria-label="${state.collapsed?'展开':'收起'}侧栏" aria-expanded="${!state.collapsed}">${icon('collapse')}<span class="nav-name">收起侧栏</span></button><div class="profile"><span class="avatar">${icon('user')}</span><span class="profile-copy"><strong>本地工作空间</strong><small>无需登录 · Web 端</small></span></div></div></aside><div class="layout"><header class="topbar"><div class="crumb"><span>工作空间</span>${icon('chevron')}<strong>${names[state.page]}</strong>${state.page==='task'||state.page==='report'?`${icon('chevron')}<span class="mono">${tasks[state.task].id}</span>`:''}</div><div class="top-actions"><span class="preview-label">交互原型 · 示例数据</span>${headerActions()}</div></header><main class="content" id="main"><div class="page"><h1 class="sr">${names[state.page]}</h1>${({overview, single, batch, task, report, review, settings, components})[state.page]()}<footer class="page-footer"><span>CDU-MED Studio <span style="margin:0 6px;color:#b6c1cf">/</span> 医学影像报告质控</span><span>设计审核原型 · 所有数据均为合成示例 · 未连接业务服务</span></footer></div></main></div>`;}
function tableRows(rows,reviewMode=false){return rows.map(t=>`<tr><td><div class="task-name"><span class="file-icon">${icon('file')}</span><div><button class="link" data-action="${reviewMode?'review-task:':'task:'}${tasks.indexOf(t)}"><strong>${t.name}</strong></button><small>${t.file}</small></div></div></td><td class="mono">${t.n}</td>${reviewMode?`<td>${badge(pendingFor(t)+' 条','amber')}</td><td class="mono">${t.time}</td>`:`<td>${status(t.status)}</td><td><span class="mono small">${t.done} <span class="muted">/ ${t.total}</span></span><div class="table-progress ${t.status==='completed'?'done':''}"><i style="width:${t.done/t.total*100}%"></i></div></td><td class="mono muted small">${t.time}</td>`}<td>${btn(reviewMode?'进入复核':'查看',`${reviewMode?'review-task:':'task:'}${tasks.indexOf(t)}`,'ghost small-btn','arrow')}</td></tr>`).join('')}
function overview(){return `<div class="metric-strip">${[['报告总数','29','份原始报告','file'],['质控任务','6','全部任务','layers'],['待人工复核',String(pendingTotal()),'条建议','checklist'],['运行中任务','1','任务后台处理','activity']].map(([a,b,c,d])=>`<div class="metric"><div class="metric-label">${a}${icon(d)}</div><div class="metric-value mono">${b}<span class="metric-foot">${c}</span></div></div>`).join('')}</div><div class="dashboard"><section class="panel"><div class="panel-head"><div class="row"><h2>近期质控任务</h2>${badge('最近 6 项')}</div>${btn('全部任务','goto:batch','ghost small-btn','arrow')}</div><div class="table-scroll"><table><thead><tr><th>任务 / 来源</th><th>报告数</th><th>状态</th><th>工作单元</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${tableRows(tasks)}</tbody></table></div><div class="panel-foot"><span>四项检查独立执行，失败项保留重试入口</span><span class="row">${icon('clock')}最近更新 09:59</span></div></section><div class="stack"><section class="panel"><div class="panel-head"><h2>开始工作</h2>${icon('arrow')}</div>${[['single','file','单份报告质控','粘贴描述与诊断'],['import','upload','导入批量报告','CSV / XLSX · 字段映射'],['review','checklist','处理待复核建议','按质控任务集中复核']].map(([p,i,t,s])=>`<button class="shortcut" data-action="${p==='import'?'import':'goto:'+p}">${icon(i)}<span><strong>${t}</strong><small>${s}</small></span>${icon('arrow','arrow')}</button>`).join('')}</section><section class="panel"><div class="panel-head"><h2>待复核分布</h2>${badge('5 个任务','amber')}</div><div class="review-stat"><b class="mono">${pendingTotal()}</b><span class="muted small"> 条建议等待确认</span></div><div class="mini-breakdown">${[['诊断一致性',8,76],['字符纠错',6,57],['语法纠错',4,38],['检索增强定位',3,28]].map(([n,c,w])=>`<div><div class="bar-label"><span>${n}</span><span class="mono">${c}</span></div><div class="bar-track"><i style="width:${w}%"></i></div></div>`).join('')}</div><div class="status-line"><span class="status-dot"></span>推理与检索服务已就绪${btn('查看','goto:settings','ghost small-btn')}</div></section></div></div>`}
function checkOptions(){return checks.map(([k,n,d])=>`<label class="check-option"><input type="checkbox" data-check="${k}" ${state.selected.includes(k)?'checked':''}><span><strong>${n}</strong><small>${d}</small></span></label>`).join('')}
function single(){return `<div class="form-grid"><section class="panel"><div class="panel-head line"><div class="row">${icon('file')}<h2>原始影像报告</h2></div>${btn('清空','clear','ghost small-btn','refresh')}</div><div class="panel-body"><label class="field"><span class="field-label">影像描述 <span class="required">*</span></span><textarea id="description" class="report-editor" placeholder="粘贴影像所见原文，不需要预先修正">${esc(state.description)}</textarea><span class="field-hint"><span>保留输入原文，模型建议单独保存</span><span id="char-count" class="mono">${state.description.length} 字</span></span></label><label class="field mt24"><span class="field-label">医生诊断 <span class="required">*</span></span><textarea id="diagnosis" rows="4" placeholder="填写医生诊断，用于一致性检查">${esc(state.diagnosis)}</textarea></label><div id="form-error"></div></div></section><div class="stack"><section class="panel"><div class="panel-head line"><h2>检查项目</h2><span id="check-count" class="check-summary">已选 ${state.selected.length} / 4</span></div><div class="check-list">${checkOptions()}</div><div class="panel-foot"><span class="row"><span class="status-dot"></span>所选检查可运行</span>${btn('配置','goto:settings','ghost small-btn')}</div></section><div class="callout">${icon('info')}<span>提交后可离开页面。任务在后台执行，结果按检查项目分别展示。</span></div></div></div>`}
function filtered(){let r=tasks.filter(t=>(state.filter==='all'||t.status===state.filter)&&(!state.query||(t.name+t.file+t.id).toLowerCase().includes(state.query.toLowerCase())));return state.sort?r.slice().reverse():r}
function batch(){return `<section class="panel"><div class="filters"><div class="segments" aria-label="任务状态筛选">${[['all','全部',6],['running','运行中',1],['completed','已完成',3],['partial','部分完成',2]].map(([v,n,c])=>`<button class="${state.filter===v?'active':''}" data-action="filter:${v}" aria-pressed="${state.filter===v}">${n}<span class="n">${c}</span></button>`).join('')}</div><label class="search">${icon('search')}<input id="task-search" aria-label="搜索任务" placeholder="搜索任务名称、文件或 ID" value="${esc(state.query)}"></label></div><div class="table-scroll"><table><thead><tr><th>任务 / 来源文件</th><th>报告数</th><th>执行状态</th><th>工作单元</th><th><button class="link muted" data-action="sort">创建时间 ${icon('sort')}</button></th><th>操作</th></tr></thead><tbody id="batch-body">${tableRows(filtered())}</tbody></table><div id="batch-empty" class="empty ${filtered().length?'hidden':''}">${icon('search')}<h3>没有找到匹配任务</h3><p>尝试其他关键词或切换状态</p></div></div><div class="panel-foot"><span id="task-total">共 ${filtered().length} 个任务</span><div class="row"><span>每页 20 条</span><button class="btn small-btn" disabled>上一页</button><span class="badge blue">1</span><button class="btn small-btn" disabled>下一页</button></div></div></section>`}
function task(){const t=tasks[state.task];return `<section class="panel task-overview"><span class="file-icon">${icon('file')}</span><div class="grow"><h2>${t.name}</h2><span class="muted small">${t.file} <span style="margin:0 8px">·</span> ${t.time}</span></div>${status(t.status)}<div class="summary-item">报告总数<b class="mono">${t.n}</b></div><div class="summary-item">完成工作单元<b class="mono">${t.done}<span class="small muted"> / ${t.total}</span></b></div><div class="summary-item">待复核建议<b class="mono">${pendingFor(t)}</b></div></section>${t.status==='partial'?`<div class="callout amber" style="margin-bottom:16px">${icon('alert')}<span>第 3 份报告的诊断检查未完成，其余检查已继续处理。可单独重试失败项。</span>${btn('查看失败详情','error','ghost small-btn')}</div>`:''}<section class="panel"><div class="panel-head"><h2>报告明细 <span class="muted small">${t.n} 份</span></h2><select id="report-filter" aria-label="筛选报告"><option value="all">全部报告</option><option value="issue">发现异常</option><option value="no_issue">未发现异常</option></select></div><div class="table-scroll"><table><thead><tr><th>报告 / 原始行</th><th>描述摘要</th><th>四项检查</th><th>质控发现</th><th>操作</th></tr></thead><tbody id="report-rows">${reportRows(t.n)}</tbody></table></div><div class="panel-foot"><span>诊断 · 字符 · 语法 · 定位</span><span>点击报告查看定位、建议与证据</span></div></section>`}
function reportRows(n,filter='all'){return Array.from({length:n},(_,i)=>({i,issue:i%3!==1})).filter(r=>filter==='all'||(filter==='issue'?r.issue:!r.issue)).map(({i,issue})=>`<tr><td><strong class="mono">RPT-${String(i+1).padStart(3,'0')}</strong><small>原始第 ${i+2} 行</small></td><td style="max-width:260px"><span>双肺纹理增多，右肺上叶见条索状…</span><small>胸部 CT · ${104+i*7} 字</small></td><td><div class="branch-summary">${['诊断','字符','语法','定位'].map((s,j)=>badge(s,(i===2&&j===0&&tasks[state.task].status==='partial')?'red':issue&&j===1?'amber':'green',(i===2&&j===0&&tasks[state.task].status==='partial')?'x':issue&&j===1?'alert':'check')).join('')}</div></td><td>${issue?badge('发现异常','amber'):badge('未发现异常','green')}</td><td>${btn('查看报告','report:'+i,'ghost small-btn','arrow')}</td></tr>`).join('')}
function tabs(){return `<div class="tabs" role="tablist" aria-label="质控检查项目">${checks.map(([k,n,d,ic])=>`<button role="tab" aria-selected="${state.branch===k}" class="${state.branch===k?'active':''}" data-action="branch:${k}">${icon(ic)}${n}<span class="tab-count">${k==='csc'?1:k==='diagnosis'?1:0}</span></button>`).join('')}</div>`}
function sourceDocument(){return `<div class="document-title"><span class="row">${icon('file')}原始报告</span>${badge('原文只读')}</div><div class="document-section"><h3>影像描述</h3>${[`${state.branch==='rag'?'双肺纹理增多，<mark>右肺上叶见条索状高密度影</mark>，边界尚清。':'双肺纹理增多，右肺上叶见条索状高密度影，边界尚清。'}`,`双侧肺门未见明显增大。气管及主支气${state.branch==='csc'?'<mark>官</mark>':'官'}通畅。`,'纵隔内未见明显肿大淋巴结，心影大小正常。','双侧胸腔未见积液。'].map((t,i)=>`<div class="sentence-line"><span class="line-num">${i+1}</span><p class="report-text">${t}</p></div>`).join('')}</div><div class="document-section"><h3>医生诊断</h3><p class="report-text">1. ${state.branch==='diagnosis'?'<mark>右肺下叶纤维灶</mark>':'右肺下叶纤维灶'}。<br>2. 双肺纹理增多。</p></div><div class="document-note">高亮片段对应当前检查定位；原始报告不会自动覆盖。</div>`}

function handle(action){const [kind,value]=action.split(':');if(kind==='goto'){closeModal();goto(value)}else if(kind==='collapse'){state.collapsed=!state.collapsed;render()}else if(kind==='task'){state.task=Number(value);goto('task')}else if(kind==='report'){state.queue=Number(value);state.branch='csc';goto('report')}else if(kind==='branch'){state.branch=value;render()}else if(kind==='filter'){state.filter=value;render()}else if(kind==='sort'){state.sort=!state.sort;render()}else if(kind==='review-task'){state.task=Number(value);state.reviewTask=true;state.queue=0;state.queuePage=0;state.branch='csc';goto('review')}else if(kind==='review-back'){state.reviewTask=false;render()}else if(kind==='queue'){state.queue=Number(value);state.branch=state.queue%2?'diagnosis':'csc';render()}else if(kind==='queue-next'){state.queuePage=state.queuePage===0?1:0;render()}else if(kind==='next-report'){if(state.queue+1<tasks[state.task].n){state.queue++;render()}}else if(kind==='decision'){state.decision[decisionKey()]=value;render();toast('演示：本条建议'+value+'，原文保持独立保存。')}else if(kind==='close'){closeModal()}else if(kind==='evidence'){evidence()}else if(kind==='import'){state.importStep=1;importDialog()}else if(kind==='import-sample'){state.filename='chest_ct_validation_demo.xlsx';state.importStep=2;importDialog()}else if(kind==='import-confirm'){closeModal();state.task=0;goto('task');toast('示例任务已打开；没有上传文件或启动真实推理。')}else if(kind==='error'){errorDialog()}else if(kind==='retry'){closeModal();tasks[state.task].status='running';render();toast('演示：失败分支已重新排队。')}else if(kind==='sample'){state.description='双肺纹理增多，右肺上叶见条索状高密度影，边界尚清。\n双侧肺门未见明显增大。气管及主支气官通畅。\n纵隔内未见明显肿大淋巴结，心影大小正常。\n双侧胸腔未见积液。';state.diagnosis='1. 右肺下叶纤维灶。\n2. 双肺纹理增多。';render();toast('已填入合成示例报告。')}else if(kind==='clear'){state.description='';state.diagnosis='';render();document.querySelector('#description').focus()}else if(kind==='start'){if(!state.description.trim()||!state.selected.length||(state.selected.includes('diagnosis')&&!state.diagnosis.trim())){document.querySelector('#form-error').innerHTML=`<div class="callout error mt16" role="alert">${icon('alert')}请填写影像描述、诊断，并至少选择一项检查。</div>`;return}state.task=0;goto('task');toast('已打开演示任务；未连接真实推理服务。')}else if(kind==='refresh'||kind==='detect'){toast(kind==='detect'?'演示状态已刷新；此原型不检测实际服务。':'示例列表已刷新。')}else if(kind==='edit'){openModal('编辑后确认',`<label class="field"><span class="field-label">确认内容</span><textarea id="review-edit" rows="5">气管及主支气管通畅。</textarea></label><label class="field mt16"><span class="field-label">复核备注</span><input id="review-note" class="full" placeholder="可选：记录判断依据"></label>`,`<span class="small muted">仅保存到本次原型交互</span>${btn('确认修改','edit-confirm','primary','check')}`)}else if(kind==='edit-confirm'){if(!document.querySelector('#review-edit').value.trim()){toast('请填写确认内容');return}closeModal();state.decision[decisionKey()]='已编辑确认';render();toast('演示：已保存编辑后的复核意见。')}else if(kind==='raw'){openModal('原始响应 · 演示',`<pre>${esc(JSON.stringify({status:'succeeded',finding:'issue',suggestions:[{before:'官',after:'管',note:'原型演示数据'}]},null,2))}</pre>`)}else if(kind==='method'){openModal('本次方法配置',`<dl><div class="kv"><dt>字符处理</dt><dd>128 字分块，全文位置对齐</dd></div><div class="kv"><dt>检索证据</dt><dd>Top 10 · 来源与原文留存</dd></div><div class="kv"><dt>版本</dt><dd>原型示例，正式系统使用任务配置快照</dd></div></dl>`)}else if(kind==='sources'){openModal('StyleKit 选型依据',`<table class="source-table"><tbody>${sourceRows()}</tbody></table><div class="callout mt16">${icon('info')}统一采用浅色企业视觉；布局参考只提供结构，报告阅读区保持静止，不拼接各风格的动效、配色与营销元素。</div>`)}else if(kind==='export'){const blob=new Blob(['\ufeff报告ID,检查项目,状态\nDEMO-RPT-001,字符纠错,演示发现异常\n'],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='原型示例结果.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出示例 CSV；正式系统保留 XLSX 导出。')}else if(kind==='demo-toast'){toast('操作反馈示例：状态已更新。')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();handle(el.dataset.action)}else if(e.target.matches('[data-backdrop]'))closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='description'){state.description=e.target.value;document.querySelector('#char-count').textContent=state.description.length+' 字'}if(e.target.id==='diagnosis')state.diagnosis=e.target.value;if(e.target.id==='task-search'){state.query=e.target.value;const rows=filtered();document.querySelector('#batch-body').innerHTML=tableRows(rows);document.querySelector('#task-total').textContent='共 '+rows.length+' 个任务';document.querySelector('#batch-empty').classList.toggle('hidden',rows.length>0)}});
document.addEventListener('change',e=>{if(e.target.dataset.check){state.selected=e.target.checked?[...state.selected,e.target.dataset.check]:state.selected.filter(k=>k!==e.target.dataset.check);document.querySelector('#check-count').textContent=`已选 ${state.selected.length} / 4`}if(e.target.id==='report-filter')document.querySelector('#report-rows').innerHTML=reportRows(tasks[state.task].n,e.target.value);if(e.target.id==='import-file'&&e.target.files[0]){state.filename=e.target.files[0].name;state.importStep=2;importDialog()}});
document.addEventListener('keydown',e=>{const modal=document.querySelector('[role=dialog]');if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const all=[...modal.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select,textarea,summary')];const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(names[p]&&p!==state.page){state.page=p;state.query='';state.filter='all';closeModal();render()}});
